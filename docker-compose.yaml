services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
      - PORT=3000
      - ADMIN_USER=admin
      - ADMIN_PASS=${SERVICE_PASSWORD_ADMIN}
      - PREVIEW_TOKEN=${SERVICE_PASSWORD_SESSION}
      - CF_API_TOKEN=${CLOUDFLARE_API_TOKEN:?}
      - CF_PROJECT=${CF_PAGES_PROJECT:?}
      - CF_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
    volumes:
      - app-data:/app/data

volumes:
  app-data:
